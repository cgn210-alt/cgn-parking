<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<!-- 카카오톡 등 링크 공유 썸네일(parking-og.png) 원본. 1200x630 으로 캡처해서 PNG 로 저장 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Noto Sans KR', sans-serif;
    position:relative;
    background:
      radial-gradient(900px 600px at 0% -10%, rgba(255,255,255,0.18), transparent 55%),
      linear-gradient(135deg, #b93c0b 0%, #d9480f 50%, #f08c3a 100%);
  }
  .frame { position:absolute; inset:22px; border:2px solid rgba(255,255,255,0.35); border-radius:18px; }
  .pill {
    position:absolute; top:64px; left:68px;
    font-size:18px; font-weight:700; letter-spacing:0.18em;
    color:#8a2c06; background:#fff; padding:8px 20px; border-radius:30px;
  }
  .title { position:absolute; top:130px; left:66px; font-size:82px; font-weight:900; line-height:1.2; color:#fff; text-shadow:0 3px 14px rgba(0,0,0,0.18); }
  .title .l2 { color:#4a1703; text-shadow:none; }
  .subtitle { position:absolute; top:356px; left:68px; font-size:27px; font-weight:700; color:#fff6ee; line-height:1.6; }
  .footer-tag {
    position:absolute; bottom:56px; left:68px;
    font-size:19px; font-weight:700; color:#8a2c06;
    background:rgba(255,255,255,0.9); padding:7px 18px; border-radius:24px;
  }
  .art { position:absolute; right:58px; bottom:70px; }
</style>
</head>
<body>

<div class="frame"></div>
<div class="pill">CGN 직원 주차</div>
<div class="title">
  <div>주차 신청</div>
  <div class="l2">별관 · 남경</div>
</div>
<div class="subtitle">매주 금요일 오후 2시~2시 30분 신청<br>오후 4시 다음 주 배정 결과 발표</div>
<div class="footer-tag">cgn210-alt.github.io/cgn-parking</div>

<!-- 주차 표지판 + 승용차 -->
<svg class="art" width="520" height="440" viewBox="0 0 520 440" xmlns="http://www.w3.org/2000/svg">
  <!-- 바닥 그림자 -->
  <ellipse cx="250" cy="404" rx="230" ry="16" fill="rgba(0,0,0,0.16)" />
  <!-- 주차 표지판 -->
  <rect x="430" y="70" width="12" height="334" rx="4" fill="#f4e3d6" />
  <rect x="380" y="20" width="112" height="112" rx="20" fill="#1a4f9c" stroke="#fff" stroke-width="7" />
  <text x="436" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="84" font-weight="700" fill="#fff">P</text>
  <!-- 차체 -->
  <path d="M40 330 L40 282 Q42 252 74 246 L128 238 L176 182 Q190 166 214 166 L318 166 Q342 166 358 182 L404 236 L440 244 Q466 250 468 278 L468 330 Q468 344 454 344 L54 344 Q40 344 40 330 Z" fill="#ffffff" />
  <!-- 창문 -->
  <path d="M146 238 L188 190 Q196 182 210 182 L254 182 L254 238 Z" fill="#cfe0f5" />
  <path d="M270 182 L314 182 Q330 182 340 192 L382 238 L270 238 Z" fill="#cfe0f5" />
  <!-- 문 선, 손잡이 -->
  <line x1="262" y1="182" x2="262" y2="330" stroke="#e7d3c4" stroke-width="4" />
  <rect x="214" y="256" width="30" height="7" rx="3.5" fill="#d9c2b2" />
  <rect x="296" y="256" width="30" height="7" rx="3.5" fill="#d9c2b2" />
  <!-- 라이트 -->
  <rect x="444" y="262" width="24" height="16" rx="6" fill="#ffd27a" />
  <rect x="40" y="262" width="18" height="16" rx="6" fill="#ff8a6b" />
  <!-- 범퍼 줄 -->
  <rect x="40" y="306" width="428" height="8" fill="#f1e2d6" />
  <!-- 바퀴 -->
  <circle cx="132" cy="344" r="48" fill="#2b2622" />
  <circle cx="132" cy="344" r="20" fill="#cfc6bf" />
  <circle cx="378" cy="344" r="48" fill="#2b2622" />
  <circle cx="378" cy="344" r="20" fill="#cfc6bf" />
</svg>

</body>
</html>
