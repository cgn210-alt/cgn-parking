<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" />
<!-- 관리자 화면 링크 공유 썸네일(parking-admin-og.png) 원본. 1200x630 으로 캡처해서 PNG 로 저장 -->
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:1200px; height:630px; overflow:hidden; }
  body {
    font-family:'Noto Sans KR', sans-serif;
    position:relative;
    background:
      radial-gradient(900px 600px at 0% -10%, rgba(255,255,255,0.10), transparent 55%),
      linear-gradient(135deg, #1f2a3a 0%, #2b3a52 55%, #3a4d6b 100%);
  }
  .frame { position:absolute; inset:22px; border:2px solid rgba(255,255,255,0.22); border-radius:18px; }
  .pill {
    position:absolute; top:64px; left:68px;
    font-size:18px; font-weight:700; letter-spacing:0.18em;
    color:#fff; background:#d9480f; padding:8px 20px; border-radius:30px;
  }
  .title { position:absolute; top:130px; left:66px; font-size:82px; font-weight:900; line-height:1.2; color:#fff; }
  .title .l2 { color:#f6a26b; }
  .subtitle { position:absolute; top:268px; left:68px; font-size:27px; font-weight:700; color:#dbe3ef; line-height:1.6; }
  .footer-tag {
    position:absolute; bottom:56px; left:68px;
    font-size:19px; font-weight:700; color:#1f2a3a;
    background:rgba(255,255,255,0.9); padding:7px 18px; border-radius:24px;
  }
  .art { position:absolute; right:70px; bottom:78px; }
</style>
</head>
<body>

<div class="frame"></div>
<div class="pill">관리자 전용</div>
<div class="title">
  <div>주차 관리</div>
</div>
<div class="subtitle">직원 승인 · 월별 그룹 · 주간 배정<br>일자별 현황 · 통계 · 공지</div>
<div class="footer-tag">cgn210-alt.github.io/cgn-parking/admin.html</div>

<!-- 배정표 클립보드 + 주차 표지판 -->
<svg class="art" width="440" height="430" viewBox="0 0 440 430" xmlns="http://www.w3.org/2000/svg">
  <ellipse cx="200" cy="410" rx="190" ry="14" fill="rgba(0,0,0,0.25)" />
  <!-- 클립보드 -->
  <rect x="40" y="40" width="270" height="350" rx="22" fill="#f4e3d6" />
  <rect x="62" y="70" width="226" height="300" rx="10" fill="#ffffff" />
  <rect x="120" y="22" width="110" height="44" rx="12" fill="#d9480f" />
  <!-- 표 줄 -->
  <rect x="84" y="96" width="182" height="22" rx="6" fill="#dbe3ef" />
  <g fill="#e8edf4">
    <rect x="84" y="134" width="182" height="16" rx="5" />
    <rect x="84" y="164" width="182" height="16" rx="5" />
    <rect x="84" y="194" width="182" height="16" rx="5" />
    <rect x="84" y="224" width="182" height="16" rx="5" />
    <rect x="84" y="254" width="182" height="16" rx="5" />
  </g>
  <!-- 체크 표시 -->
  <g fill="none" stroke="#1e7a46" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M92 142 l6 6 l12 -12" />
    <path d="M92 172 l6 6 l12 -12" />
    <path d="M92 202 l6 6 l12 -12" />
  </g>
  <rect x="84" y="300" width="120" height="40" rx="10" fill="#d9480f" />
  <!-- 주차 표지판 -->
  <rect x="368" y="150" width="12" height="250" rx="4" fill="#dbe3ef" />
  <rect x="318" y="96" width="112" height="112" rx="20" fill="#1a4f9c" stroke="#fff" stroke-width="7" />
  <text x="374" y="184" text-anchor="middle" font-family="Arial, sans-serif" font-size="84" font-weight="700" fill="#fff">P</text>
</svg>

</body>
</html>
